<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUSHOMA | Product Verification</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="verification-page">

        <div class="card">

            <div class="brand">
                <div class="brand-name">SUSHOMA</div>
                <div class="brand-tagline">চুলের যত্নে প্রকৃতির ছোঁয়া</div>
            </div>

            <div class="verify-icon">
                ✓
            </div>

            <h1>Product Verification</h1>

            <p class="subtitle">
                Verify your SUSHOMA product and make sure it is genuine.
            </p>

            <div class="input-area">

                <label for="productId">
                    Product ID
                </label>

                <input
                    type="text"
                    id="productId"
                    placeholder="Enter your Product ID"
                    autocomplete="off"
                >

            </div>

            <button id="verifyBtn" onclick="verifyProduct()">
                <span id="btnText">Verify Product</span>
                <span id="loader" class="loader"></span>
            </button>

            <p class="hint">
                Enter the Product ID printed on your product.
            </p>

            <div class="footer">
                <span>🌿</span>
                SUSHOMA — Authenticity Verification
            </div>

        </div>

    </main>


    <!-- Result Popup -->

    <div id="popupOverlay" class="popup-overlay">

        <div id="popup" class="popup">

            <button class="close-btn" onclick="closePopup()">
                ×
            </button>

            <div id="popupIcon" class="popup-icon"></div>

            <h2 id="popupTitle"></h2>

            <p id="popupMessage"></p>

            <div id="productInfo" class="product-info"></div>

            <button class="popup-btn" onclick="closePopup()">
                Verify Another Product
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
